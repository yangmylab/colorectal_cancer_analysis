# Track A study configuration
# Single source of truth for paths, cohorts, QC thresholds and model parameters.
# Freeze this file before outcome modeling; record any later change in manifests/config_changelog.tsv.

project:
  name: crc_multiomics_ecotypes
  version: 0.1.0
  date: "2026-11-17"
  seed: 20261117
  description: "Cross-platform, single-cell-anchored ecotype taxonomy of colorectal cancer"

paths:
  data_raw: analysis/data/raw
  data_processed: analysis/processed
  reference: analysis/reference
  results: analysis/results
  figures: analysis/figures
  manifests: analysis/manifests
  metadata: analysis/metadata
  logs: analysis/logs

cohorts:
