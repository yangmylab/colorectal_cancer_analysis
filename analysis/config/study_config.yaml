  optional:
    microbiome: curatedMetagenomicData
    metabolome: [MetabolomicsWorkbench, MetaboLights]
    imaging: [TCGA_slides, IDC, HPA]
    normal_reference: HCA_Gut_Cell_Atlas

inclusion:
  sample_types: [primary_tumor]
  exclude_metastasis_from_discovery: true
  require_stage: true
  require_survival: true
  min_tumor_purity: 0.20
  min_genes_detected: 10000
  max_missing_clinical_fraction: 0.20
  outlier_sd: 4

endpoints:
  primary: css
  secondary: [os, rfs]
  exploratory: [ici_response, anti_egfr_response, adjuvant_chemo_response]
  time_unit: days

normalization:
  rna: tpm_log2
  arrays: rma
  methylation: bmiq_mvalues
  proteome: median_log2
  phospho: protein_normalized_log2
  cnv: gene_level_log2_ratio

batch_correction:
  bulk_counts: combat_seq
  arrays: remove_batch_effect
  single_cell: scvi
  single_cell_sensitivity: harmony
  microbiome: mmuphin

qc:
  min_samples_discovery: 500
  min_events_discovery: 100
  max_outlier_fraction: 0.05
  min_cross_platform_correlation: 0.20
  pca_batch_residual_check: true

deconvolution:
  methods: [cibersortx, epic, quantiseq, mcp_counter, xcell]
  consensus: rank_mean
  purity_adjustment: true
  min_method_concordance_spearman: 0.70

programs:
  method: nmf
  min_genes: 20
  bootstrap_stability: 0.80
  scoring: [ssgsea, gsva, aucell]
  compartments: [epithelial, fibroblast, myeloid, t_nk, b_plasma, endothelial, glial]

integration:
  primary: mofa
  factors: 15
  views: [rna_programs, methylation, proteome, phospho, cnv]
  sensitivity: [iclusterbayes, snf, diablo]
  min_variance_explained_per_view: 0.30

ecotypes:
  k_range: [2, 8]
  k_preferred: [3, 6]
  consensus_bootstraps: 1000
  min_group_fraction: 0.05
  stability_ari_min: 0.70
  replication_ari_min: 0.50
  classifier: nearest_shrunken_centroid
  classifier_cv_folds: 10
  classifier_cv_repeats: 10

survival:
  base_covariates: [age, sex, stage, msi_status, sidedness, cms]
  full_model_extra: [ecotype]
  metrics: [c_index, time_auc, calibration_slope, calibration_intercept, dca, nri, idi]
  time_auc_years: [3, 5]
  bootstrap: 1000
  calibration_bins: 10
  dca_thresholds: [0.10, 0.20, 0.30, 0.40, 0.50]
  fdr_secondary: 0.05

spatial:
  deconvolution: [cell2location, rctd]
  sensitivity: [spatialdecon]
  niche_method: cellcharter
  neighborhood: squidpy
  ligand_receptor: [cellchat, nichenet]
  signatures: [tls, invasive_front, hypoxia, immune_exclusion, caf_rich]
  min_datasets_for_replication: 2
  meta_analysis: random_effects

drug:
  signature_genes: 150
  resources: [cmap, lincs, gdsc, ctrp, prism, depmap]
  max_candidates_per_ecotype: 20
  prioritize: 5
  claim_level: hypothesis_generating

proteogenomics:
  - id: PXD079707
    source: PRIDE
    role: proteomic_anchor
    content: [dia_proteome, targeted_genomics, wsi, clinical]
    n_cases: 1000
    access: open_cc0
    note: "Confirm processed tables and metadata completeness."
  - id: PXD052391
    source: ProteomeXchange/iProx
    role: progression
    content: [proteome, phosphoproteome]
    n_patients: 148
    n_samples: 435
    note: "WES restricted under HRA007452."
  - id: IPX0007391001
    source: iProx/GSA
    role: metastasis
    content: [genomics, transcriptome, proteome, phosphoproteome]
    n_patients: 34
    n_samples: 102
    note: "PRJCA020890."
  - id: PXD019103
    source: PRIDE
    role: orthogonal_validation
    content: [proteome]

